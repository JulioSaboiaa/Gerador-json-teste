<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Cadastros</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body { font-family:'Segoe UI',sans-serif; margin:0; background:#f5f5f5; }
header { background:#d50000; color:#fff; padding:15px; text-align:center; }
.container { max-width:1100px; margin:20px auto; background:white; padding:20px; border-radius:8px; }
.tabs { display:flex; gap:10px; margin-bottom:15px; }
.tab { padding:8px 15px; border:2px solid #d50000; color:#d50000; cursor:pointer; border-radius:6px; }
.tab.active { background:#d50000; color:white; }
input, select, button, textarea { width:100%; padding:8px; margin-top:6px; }
button { background:#d50000; color:white; border:none; cursor:pointer; }
button:hover { background:#a30000; }
.owner-block { background:#fff4f4; padding:10px; border-radius:8px; margin-top:10px; }
.hidden { display:none; }
textarea { height:220px; font-family:monospace; }
.copy-btn { background:#333; margin-top:5px; }
.copy-btn:hover { background:#000; }
.top-bar { display:flex; gap:10px; align-items:center; }
.top-bar button { width:auto; }
.admin-box { background:#f9f9f9; padding:15px; border-radius:8px; margin-top:10px; }
</style>
</head>
<body>

<header>Sistema de Cadastros</header>

<!-- LOGIN -->
<div id="loginScreen" class="container">
  <h2>Login</h2>
  <input id="loginEmail" placeholder="Email">
  <input id="loginSenha" type="password" placeholder="Senha">
  <button onclick="login()">Entrar</button>
</div>

<!-- APP -->
<div id="appWrapper" class="container hidden">

<div class="top-bar">
  <div class="tabs">
    <div class="tab active" id="tabPJ">Pessoa Jurídica</div>
    <div class="tab" id="tabPF">Pessoa Física</div>
  </div>
  <div style="flex:1"></div>
  <button id="adminBtn" class="hidden" onclick="abrirAdmin()">Painel Admin</button>
  <button onclick="logout()">Sair</button>
</div>

<!-- ADMIN PANEL -->
<div id="adminPanel" class="admin-box hidden">
  <h2>Painel Admin — Criar Usuário</h2>
  <input id="newUserName" placeholder="Nome do usuário">
  <input id="newUserEmail" placeholder="Email">
  <input id="newUserPassword" placeholder="Senha inicial">
  <select id="newUserRole">
    <option value="operador">Operador</option>
    <option value="admin">Admin</option>
  </select>
  <button onclick="criarUsuario()">Criar Usuário</button>
  <button onclick="fecharAdmin()">Fechar</button>
</div>

<!-- PJ -->
<div id="formPJ">
<h2>Cadastro PJ</h2>
<input id="pj_businessName" placeholder="Razão Social">
<input id="pj_documentNumber" placeholder="CNPJ">
<button onclick="generateTxtPJ()">Gerar Cadastro PJ</button>
<textarea id="outputPJ" readonly></textarea>
<button class="copy-btn" onclick="copiarTexto('outputPJ')">📋 Copiar Cadastro PJ</button>
</div>

<!-- PF -->
<div id="formPF" class="hidden">
<h2>Cadastro PF</h2>
<input id="pf_fullName" placeholder="Nome Completo">
<input id="pf_documentNumber" placeholder="CPF">
<input id="pf_birthDate" placeholder="DD/MM/AAAA">
<button onclick="generateTxtPF()">Gerar Cadastro PF</button>
<textarea id="outputPF" readonly></textarea>
<button class="copy-btn" onclick="copiarTexto('outputPF')">📋 Copiar Cadastro PF</button>
</div>

</div>

<script>
const supabaseClient = supabase.createClient("https://hrfwoawxiqeyixpgmqwn.supabase.co","sb_publishable_ad7DlGX8tj82H5pObvlhEA_-15QTlJ4");
let perfilUsuario=null;

function formatarData(data){
 if(!data) return '';
 const [d,m,a]=data.split('/');
 return `${d}-${m}-${a}`;
}

async function login(){
 const { data, error } = await supabaseClient.auth.signInWithPassword({
   email: loginEmail.value,
   password: loginSenha.value
 });
 if(error) return alert(error.message);

 const { data: profile } = await supabaseClient.from('profiles').select('role').eq('id', data.user.id).single();
 perfilUsuario = profile;

 loginScreen.classList.add("hidden");
 appWrapper.classList.remove("hidden");

 if(perfilUsuario.role==='admin') adminBtn.classList.remove('hidden');
}

function logout(){ supabaseClient.auth.signOut(); location.reload(); }

tabPJ.onclick=()=>{formPJ.classList.remove('hidden');formPF.classList.add('hidden');adminPanel.classList.add('hidden');tabPJ.classList.add('active');tabPF.classList.remove('active');}
tabPF.onclick=()=>{formPF.classList.remove('hidden');formPJ.classList.add('hidden');adminPanel.classList.add('hidden');tabPF.classList.add('active');tabPJ.classList.remove('active');}

function abrirAdmin(){
 adminPanel.classList.remove('hidden');
 formPJ.classList.add('hidden');
 formPF.classList.add('hidden');
}

function fecharAdmin(){
 adminPanel.classList.add('hidden');
 formPJ.classList.remove('hidden');
}

async function registrarAuditoria(tipo,doc){
 const { data:{user} } = await supabaseClient.auth.getUser();
 if(user){
  await supabaseClient.from('auditoria').insert({ user_id:user.id, tipo:tipo, documento:doc });
 }
}

window.generateTxtPJ=async()=>{
 const conteudo=`PJ: ${pj_businessName.value}\nCNPJ: ${pj_documentNumber.value}`;
 outputPJ.value=conteudo;
 outputPJ.select();
 await registrarAuditoria("Cadastro PJ", pj_documentNumber.value);
};

window.generateTxtPF=async()=>{
 const conteudo=`PF: ${pf_fullName.value}\nCPF: ${pf_documentNumber.value}\nNascimento: ${formatarData(pf_birthDate.value)}`;
 outputPF.value=conteudo;
 outputPF.select();
 await registrarAuditoria("Cadastro PF", pf_documentNumber.value);
};

function copiarTexto(id){
 const campo=document.getElementById(id);
 campo.select();
 document.execCommand("copy");
 alert("Copiado!");
}

async function criarUsuario(){
 const res = await fetch("https://hrfwoawxiqeyixpgmqwn.supabase.co/functions/v1/super-handler", {
   method:"POST",
   headers:{ "Content-Type":"application/json" },
   body: JSON.stringify({
     email:newUserEmail.value,
     password:newUserPassword.value,
     nome:newUserName.value,
     role:newUserRole.value
   })
 });
 const data=await res.json();
 if(data.error) return alert("Erro: "+data.error.message);
 alert("Usuário criado com sucesso!");
}
</script>

</body>
</html>
