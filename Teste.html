<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Cadastros</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body { font-family:'Segoe UI',sans-serif; margin:0; background:#f5f5f5; }
header { background:#d50000; color:#fff; padding:15px; text-align:center; }
.container { max-width:1100px; margin:20px auto; background:white; padding:20px; border-radius:8px; }
.tabs { display:flex; gap:10px; margin-bottom:15px; }
.tab { padding:8px 15px; border:2px solid #d50000; color:#d50000; cursor:pointer; border-radius:6px; }
.tab.active { background:#d50000; color:white; }
input, select, button, textarea { width:100%; padding:8px; margin-top:6px; }
button { background:#d50000; color:white; border:none; cursor:pointer; }
button:hover { background:#a30000; }
.owner-block { background:#fff4f4; padding:10px; border-radius:8px; margin-top:10px; }
.hidden { display:none; }
textarea { height:260px; font-family:monospace; }
.copy-btn { background:#333; margin-top:5px; }
.copy-btn:hover { background:#000; }
</style>
</head>
<body>

<header>Sistema de Cadastros</header>

<!-- LOGIN -->
<div id="loginScreen" class="container">
  <h2>Login</h2>
  <input id="loginEmail" placeholder="Email">
  <input id="loginSenha" type="password" placeholder="Senha">
  <button onclick="login()">Entrar</button>
</div>

<!-- APP -->
<div id="appWrapper" class="container hidden">

<div class="tabs">
  <div class="tab active" id="tabPJ">Pessoa Jurídica</div>
  <div class="tab" id="tabPF">Pessoa Física</div>
  <div style="flex:1"></div>
  <button onclick="logout()" style="width:auto">Sair</button>
</div>

<!-- ================= PJ ================= -->
<div id="formPJ">
<h2>Cadastro PJ</h2>

<input id="pj_businessName" placeholder="Razão Social">
<input id="pj_tradingName" placeholder="Nome Fantasia">
<input id="pj_documentNumber" placeholder="CNPJ" pattern="\d{14}">
<input id="pj_businessEmail" placeholder="Email Comercial">
<input id="pj_contactNumber" placeholder="Telefone">

<select id="pj_companyType">
<option value="MEI">MEI</option>
<option value="PJ">PJ</option>
</select>

<div id="pjExtraFields" class="hidden">
<select id="pj_revenue">
<option>R$81.001 – R$360.000</option>
<option>R$360.001 – R$4.800.000</option>
<option>R$4.800.001 – R$78.000.000</option>
<option>Acima de R$78.000.000</option>
</select>

<select id="pj_partnerIncome">
<option>Até R$5.000</option>
<option>R$5.001 – R$10.000</option>
<option>R$10.001 – R$30.000</option>
<option>R$30.001 – R$100.000</option>
<option>Acima de R$100.000</option>
</select>
</div>

<h3>Sócios</h3>
<div id="ownersContainer"></div>
<button type="button" id="addOwner">+ Adicionar Sócio</button>

<button onclick="generateTxtPJ()">Gerar Cadastro PJ</button>
<textarea id="outputPJ" readonly></textarea>
<button class="copy-btn" onclick="copiarTexto('outputPJ')">📋 Copiar Cadastro PJ</button>
</div>

<!-- ================= PF ================= -->
<div id="formPF" class="hidden">
<h2>Cadastro PF</h2>

<input id="pf_fullName" placeholder="Nome Completo">
<input id="pf_documentNumber" placeholder="CPF" pattern="\d{11}">
<input id="pf_birthDate" placeholder="DD/MM/AAAA">
<select id="pf_profession"><option>Autônomo</option><option>CLT</option><option>Servidor Público</option></select>
<select id="pf_assets"><option>Até R$50.000</option><option>R$50.001 a R$200.000</option></select>

<button onclick="generateTxtPF()">Gerar Cadastro PF</button>
<textarea id="outputPF" readonly></textarea>
<button class="copy-btn" onclick="copiarTexto('outputPF')">📋 Copiar Cadastro PF</button>
</div>

</div>

<script>
const supabaseClient = supabase.createClient("SEU_SUPABASE_URL","SUA_PUBLIC_ANON_KEY");

function formatarDataParaArquivo(data){
 if(!data) return '';
 const [d,m,a]=data.split('/');
 return `${d}-${m}-${a}`;
}

async function login(){
 const { error } = await supabaseClient.auth.signInWithPassword({
   email: loginEmail.value,
   password: loginSenha.value
 });
 if(error) return alert(error.message);
 loginScreen.classList.add("hidden");
 appWrapper.classList.remove("hidden");
}

function logout(){ supabaseClient.auth.signOut(); location.reload(); }

tabPJ.onclick=()=>{formPJ.classList.remove('hidden');formPF.classList.add('hidden');tabPJ.classList.add('active');tabPF.classList.remove('active');}
tabPF.onclick=()=>{formPF.classList.remove('hidden');formPJ.classList.add('hidden');tabPF.classList.add('active');tabPJ.classList.remove('active');}

pj_companyType.onchange=()=>pjExtraFields.classList.toggle('hidden',pj_companyType.value==='MEI');

addOwner.onclick=()=>{
 const div=document.createElement('div');
 div.classList.add('owner-block');
 div.innerHTML=`<input class="ownerName" placeholder="Nome Completo">
 <input class="ownerDocument" placeholder="CPF">
 <input class="ownerBirth" placeholder="DD/MM/AAAA">
 <input class="ownerCity" placeholder="Cidade">`;
 ownersContainer.appendChild(div);
};

async function registrarAuditoria(tipo,doc){
 const { data:{user} } = await supabaseClient.auth.getUser();
 if(user){
  await supabaseClient.from('auditoria').insert({ user_id:user.id, tipo:tipo, documento:doc });
 }
}

window.generateTxtPJ=async()=>{
 const conteudo=`PJ: ${pj_businessName.value}
CNPJ: ${pj_documentNumber.value}`;
 outputPJ.value=conteudo;
 outputPJ.select();
 await registrarAuditoria("Cadastro PJ", pj_documentNumber.value);
};

window.generateTxtPF=async()=>{
 const conteudo=`PF: ${pf_fullName.value}
CPF: ${pf_documentNumber.value}
Nascimento: ${formatarDataParaArquivo(pf_birthDate.value)}`;
 outputPF.value=conteudo;
 outputPF.select();
 await registrarAuditoria("Cadastro PF", pf_documentNumber.value);
};

function copiarTexto(id){
 const campo=document.getElementById(id);
 campo.select();
 document.execCommand("copy");
 alert("Copiado para a área de transferência!");
}
</script>

</body>
</html>
